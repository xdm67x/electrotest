# Tool versions for this repo — used by mise locally and via jdx/mise-action in CI.
# This is the single source of truth for the Rust version and its components.
# Cross-compilation targets are not installed here to keep local installs lean;
# add them on demand with `rustup target add <target>` (the release CI workflow
# installs each matrix target itself).
[tools]
rust = { version = "1.98.1", profile = "minimal", components = ["clippy", "rustfmt"] }

[tasks.build]
description = "Build the electrotest binary in debug mode"
run = "cargo build"

[tasks.build-release]
description = "Build the electrotest binary in release mode"
run = "cargo build --release"

[tasks.clean]
description = "Remove all build artifacts (target directory)"
run = "cargo clean"
