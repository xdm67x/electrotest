name: CI

on:
  push:
    branches:
      - '*'

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        # Tools and versions come from mise.toml.
        # cache: false is required for rust — rustup toolchains live outside the
        # mise cache dir, so cache hits skip installs and lose clippy/rustfmt
        # (https://github.com/jdx/mise-action/issues/215).
        uses: jdx/mise-action@v4
        with:
          cache: false

      - name: Build
        run: cargo build

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install electron dependencies
        run: npm install
        working-directory: examples/electron-app

      - name: Run tests
        run: cargo test

      - name: Run clippy
        run: cargo clippy

      - name: Check formatting
        run: cargo fmt --check
