[package]
name = "electrotest"
version = "0.4.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
sysinfo = "0.39.6"
# CLI
clap = { version = "4.6.7", features = ["derive"] }
regex = "1.13.1"
async-trait = "0.1.92"
# CDP / WebSocket dependencies
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "time", "fs", "macros"] }
tokio-tungstenite = "0.30.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
reqwest = { version = "0.13.5", features = ["json"] }
base64 = "0.23.1"
url = "2.5.8"
futures-util = "0.3.34"
